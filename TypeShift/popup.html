<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TypeShift</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="header">
      <h2>TypeShift</h2>
      <button id="theme-toggle" class="theme-btn" aria-label="Toggle Theme" title="Switch theme">
        <svg
          id="theme-icon"
          viewBox="0 0 24 24"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </div>

    <div class="master-toggle-row">
      <span class="master-toggle-label">Enable TypeShift</span>
      <label class="switch">
        <input id="enabled-toggle" type="checkbox" role="switch" checked title="Turn TypeShift on or off" />
        <span class="switch-slider"></span>
      </label>
    </div>
    <div id="disabled-message" class="disabled-message" hidden>
      TypeShift is disabled. Your settings are preserved.
    </div>

    <div id="configuration-controls">
      <div class="tabs" role="tablist" aria-label="Configuration scope">
        <button id="global-tab" class="tab active" type="button" role="tab" aria-selected="true" title="Set your default typography for all websites">
          Global
        </button>
        <button id="site-tab" class="tab" type="button" role="tab" aria-selected="false" title="Customize typography for this website">
          This Site
        </button>
      </div>

      <div id="site-heading" class="site-heading" hidden></div>

      <div class="custom-dropdown" id="custom-dropdown">
        <div class="dropdown-trigger" id="dropdown-trigger" title="Choose the font TypeShift will apply">Select Font</div>
        <div class="dropdown-menu hidden" id="dropdown-menu">
          <input type="text" id="font-search" placeholder="Search fonts..." />
          <div class="font-options-list" id="font-options-list"></div>
        </div>
      </div>

      <div class="typography-controls">
        <div class="control-row">
          <div class="control-label">
            <span>Font Size</span>
            <output id="font-size-value">100%</output>
          </div>
          <input id="font-size-control" class="range-control" type="range" min="80" max="140" step="5" value="100" aria-label="Font size" title="Adjust font size" />
        </div>
        <div class="control-row">
          <div class="control-label">
            <span>Line Height</span>
            <output id="line-height-value">100%</output>
          </div>
          <input id="line-height-control" class="range-control" type="range" min="80" max="140" step="5" value="100" aria-label="Line height" title="Adjust line height" />
        </div>
        <button id="reset-typography-btn" class="secondary-btn typography-reset-btn" type="button" hidden title="Reset this site's font size and line height to the global settings">
          Reset Typography
        </button>
      </div><div class="site-actions">
        <button id="toggle-disable-btn" style="display: none" title="Temporarily disable TypeShift on this website">
          Disable for this website
        </button>

        <button id="reset-site-btn" class="secondary-btn" type="button" hidden title="Remove this site custom settings and use the global configuration">
          Reset this site
        </button>
      </div>
    </div>

    <div class="secondary-links">
      <a class="secondary-link manage-link" href="sites.html" target="_blank" title="View and manage website-specific settings">Manage Sites</a>
      <a class="secondary-link settings-link" href="settings.html" target="_blank" title="Manage backups and extension settings">Settings</a>
    </div>

    <div id="status-message"></div>

    <script src="fonts.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
