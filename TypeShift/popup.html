<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TypeShift</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="header">
      <h2>TypeShift</h2>
      <button id="theme-toggle" class="theme-btn" aria-label="Toggle Theme">
        <svg
          id="theme-icon"
          viewBox="0 0 24 24"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </div>

    <div class="master-toggle-row">
      <span class="master-toggle-label">Enable TypeShift</span>
      <label class="switch">
        <input id="enabled-toggle" type="checkbox" role="switch" checked />
        <span class="switch-slider"></span>
      </label>
    </div>
    <div id="disabled-message" class="disabled-message" hidden>
      TypeShift is disabled. Your settings are preserved.
    </div>

    <div id="configuration-controls">
      <div class="tabs" role="tablist" aria-label="Configuration scope">
        <button id="global-tab" class="tab active" type="button" role="tab" aria-selected="true">
          Global
        </button>
        <button id="site-tab" class="tab" type="button" role="tab" aria-selected="false">
          This Site
        </button>
      </div>

      <div id="site-heading" class="site-heading" hidden></div>

      <div class="custom-dropdown" id="custom-dropdown">
        <div class="dropdown-trigger" id="dropdown-trigger">Select Font</div>
        <div class="dropdown-menu hidden" id="dropdown-menu">
          <input type="text" id="font-search" placeholder="Search fonts..." />
          <div class="font-options-list" id="font-options-list"></div>
        </div>
      </div>

      <button id="toggle-disable-btn" style="display: none">
        Disable for this website
      </button>

      <button id="reset-site-btn" class="secondary-btn" type="button" hidden>
        Reset this site
      </button>
    </div>

    <div class="secondary-links">
      <a class="secondary-link" href="sites.html" target="_blank">Manage Sites</a>
      <a class="secondary-link" href="settings.html" target="_blank">Settings</a>
    </div>

    <div id="status-message"></div>

    <script src="fonts.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
